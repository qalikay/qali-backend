# ============================================================
# Conexion a la base de datos PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/qalikay_db
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Comportamiento del schema
# ============================================================
# create-drop: en cada arranque se borra y recrea el schema, y se ejecuta import.sql
# (alternativas: create, update, validate, none)
spring.jpa.hibernate.ddl-auto=create-drop

# Permite que import.sql tenga sentencias multilinea (INSERTs largos)
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

# ============================================================
# Debug: imprime el SQL real que ejecuta Hibernate
# ============================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# No expone el stacktrace en respuestas de error (seguridad)
server.error.include-stacktrace=never

# ============================================================
# CORS / JWT
# ============================================================
# Origen permitido del frontend (Angular) -- ver SecurityConfig.corsFilter
ip.frontend=http://localhost:4200

