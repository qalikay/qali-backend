# ====================================================================
#  QaliKay Backend - Configuracion principal
# ====================================================================

spring.application.name=qali-backend

# --- Servidor ---
server.port=8080

# --- Base de Datos H2 (en memoria, perfecta para desarrollo y demo) ---
spring.datasource.url=jdbc:h2:mem:qalikay_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola visual de H2 (accesible en http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# No envia el stacktrace al cliente cuando hay un error
server.error.include-stacktrace=never

# --- URL del frontend (usado por CORS) ---
ip.frontend=http://localhost:4200

