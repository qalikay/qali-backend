# ====================================================================
#  QaliKay Backend - Configuracion principal
# ====================================================================

# --- Identidad de la aplicacion ---
spring.application.name=qali-backend

# --- Servidor ---
server.port=8080
server.servlet.context-path=/api/v1

# Que las URLs no encontradas lancen NoHandlerFoundException
# (asi nuestro GlobalExceptionHandler las maneja como 404 en vez de 500)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# --- Base de Datos H2 (en memoria, para desarrollo) ---
spring.datasource.url=jdbc:h2:mem:qalikay_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola visual de H2 (accesible en /h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
# create-drop = recrea las tablas en cada arranque (perfecto para desarrollo)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.qalikay.backend=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# --- Jackson (manejo de JSON) ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Lima

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false

# --- JWT ---
# Clave secreta (HS512). En produccion DEBE venir de variable de entorno.
# Esta clave es solo para desarrollo. Minimo 64 caracteres para HS512.
qalikay.security.jwt.secret=${JWT_SECRET:cHl0aG9uX3Jvb3Rfc2VjcmV0X2tleV9kZXZfZW52aXJvbm1lbnRfb25seV9kb19ub3RfdXNlX2luX3Byb2RfMjAyNg==}
qalikay.security.jwt.access-token-expiration-ms=3600000
qalikay.security.jwt.refresh-token-expiration-ms=604800000
qalikay.security.jwt.issuer=qalikay-api
